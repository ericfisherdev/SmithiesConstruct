name: CI

on:
  pull_request:
    branches: ['1.21.1']
  push:
    branches: ['1.21.1']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' && github.ref != 'refs/heads/1.21.1' }}

      - name: Run JUnit tests
        run: ./gradlew test --stacktrace

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/

  lint:
    name: PMD (new code only)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Run PMD
        run: ./gradlew pmdMain pmdTest

      - name: Install reviewdog
        uses: reviewdog/action-setup@v1
        with:
          reviewdog_version: v0.20.2

      - name: Report new PMD findings on PR diff
        if: github.event_name == 'pull_request'
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for report in build/reports/pmd/main.xml build/reports/pmd/test.xml; do
            [ -s "$report" ] || continue
            python3 scripts/ci/pmd_to_checkstyle.py "$report" \
              | reviewdog \
                  -f=checkstyle \
                  -name="pmd" \
                  -reporter=github-pr-check \
                  -filter-mode=added \
                  -fail-on-error=true
          done

  label:
    name: Auto-label PR
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Apply path-based labels
        uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml
