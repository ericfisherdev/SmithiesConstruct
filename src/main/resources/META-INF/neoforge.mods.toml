modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "https://github.com/ericfisherdev/SmithiesConstruct/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''
logoFile = "logo.png"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# Patchouli backs the in-game guidebook (Decision D4) — declared in build.gradle as a full
# implementation dependency, so the loader must require it at runtime. The range covers the
# whole 1.x line (Patchouli's internal mod version differs from the Maven coordinate) while
# excluding a hypothetical 2.x that could carry breaking API changes.
[[dependencies.${mod_id}]]
modId = "patchouli"
type = "required"
versionRange = "[1.0,2.0)"
ordering = "NONE"
side = "BOTH"
