plugins {
    id 'java-library'
    id 'maven-publish'
    id 'pmd'
    id 'com.diffplug.spotless' version '7.0.4'
    id 'net.neoforged.moddev' version '2.0.78'
}

version = mod_version
group = mod_group_id

base {
    archivesName = 'SConstruct'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)

neoForge {
    version = neo_version

    parchment {
        mappingsVersion = parchment_mappings_version
        minecraftVersion = parchment_minecraft_version
    }

    runs {
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'debug'
        }
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        data {
            data()
            programArguments.addAll '--mod', mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }

    unitTest {
        enable()
        testedMod = mods."${mod_id}"
    }
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

// Legacy 1.12 sources under src/main/java/slimeknights/tconstruct/** are kept on disk
// for reference but excluded from the 1.21.1 build. The active port lives under
// slimeknights/sconstruct/ — widen this include as packages get ported.
sourceSets.main.java {
    include 'slimeknights/sconstruct/port1211/**'
}

repositories {
    mavenLocal()
    // Canonical home for JUnit, Mockito, PMD, Spotless's Eclipse JDT deps — anything that
    // isn't authoritatively hosted on the Forge-flavoured mirrors below. We previously used
    // an exclusiveContent block to pin specific groups here, but that constrained Spotless's
    // own classpath in a way that made it fail to resolve dev.equo.ide/org.eclipse.* at
    // runtime; the retry loop in .github/workflows/ci.yml handles transient mirror flakes
    // adequately on its own without that extra constraint.
    mavenCentral()
    maven { url = 'https://maven.blamejared.com' } // JEI, Patchouli, etc.
    maven { url = 'https://maven.tterrag.com/' }
    maven {
        name = 'ModMaven'
        url = 'https://modmaven.dev' // The One Probe
        // The One Probe's published POM declares a lower-case artifactId ("theoneprobe") that
        // does not match the capitalised "TheOneProbe" path, so Gradle rejects the metadata as
        // inconsistent. Resolve from the jar artifact directly — a self-contained mod jar
        // declares its own dependencies via neoforge.mods.toml, not the POM, so nothing is lost.
        metadataSources { artifact() }
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven' // Jade
        content {
            includeGroup 'maven.modrinth'
        }
    }
    maven {
        name = 'CurseMaven'
        url = 'https://www.cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
}

dependencies {
    // TODO: pin a 1.21.1-compatible Mantle once available.
    // implementation "slimeknights.mantle:Mantle:1.21.1-x.y.z"

    // JEI (SMTCON-147) — the recipe-viewer integration. The API jars are compile-only so the
    // plugin code can reference JEI types without shipping JEI; the full NeoForge jar is
    // runtime-only so JEI loads in dev (runClient) and players supply it themselves.
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    runtimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"

    // Patchouli (SMTCON-148) — the in-game guidebook framework that replaces the legacy in-house
    // book code (Decision D4). A full implementation dependency: the book content references
    // Patchouli at compile time and Patchouli is required at runtime for the book to open.
    implementation "vazkii.patchouli:Patchouli:${patchouli_version}"

    // Jade & The One Probe (SMTCON-149) — the two tooltip/probe HUD integrations. compileOnly so
    // the plugin code compiles against their APIs without shipping them; runtimeOnly so both
    // load in dev (runClient) and players supply them themselves. Jade resolves from the
    // Modrinth maven by semantic version (CurseMaven would need an opaque per-file numeric id);
    // The One Probe resolves from the modmaven mirror.
    compileOnly "maven.modrinth:jade:${jade_version}"
    runtimeOnly "maven.modrinth:jade:${jade_version}"
    compileOnly "mcjty.theoneprobe:TheOneProbe:${top_version}"
    runtimeOnly "mcjty.theoneprobe:TheOneProbe:${top_version}"

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.0'
    testImplementation 'org.mockito:mockito-core:5.14.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version       : minecraft_version,
            minecraft_version_range : minecraft_version_range,
            neo_version             : neo_version,
            neo_version_range       : neo_version_range,
            loader_version_range    : loader_version_range,
            mod_id                  : mod_id,
            mod_name                : mod_name,
            mod_license             : mod_license,
            mod_version             : mod_version,
            mod_authors             : mod_authors,
            mod_description         : mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'    : mod_name,
                'Specification-Vendor'   : mod_authors,
                'Specification-Version'  : '1',
                'Implementation-Title'   : project.name,
                'Implementation-Version' : project.version,
                'Implementation-Vendor'  : mod_authors
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

pmd {
    toolVersion = '7.24.0'
    ruleSetFiles = files('gradle/pmd/ruleset.xml')
    ruleSets = []
    consoleOutput = false
    ignoreFailures = true
}

tasks.named('pmdMain', Pmd) {
    source = fileTree(dir: 'src/main/java/slimeknights/sconstruct/port1211', include: '**/*.java')
    reports {
        xml.required = true
        html.required = false
    }
}

tasks.named('pmdTest', Pmd) {
    source = fileTree(dir: 'src/test/java', include: '**/*.java')
    reports {
        xml.required = true
        html.required = false
    }
}

spotless {
    java {
        target 'src/main/java/slimeknights/sconstruct/port1211/**/*.java',
               'src/test/java/**/*.java'
        eclipse().configFile('eclipse_formatter.xml')
        importOrder 'java', 'javax', 'net', 'org', 'com', 'slimeknights'
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
}

tasks.named('check') {
    dependsOn 'spotlessCheck'
}

tasks.register('installGitHooks') {
    group = 'verification'
    description = 'Points git core.hooksPath at scripts/git-hooks (mirrors CI lint + tests). Works across worktrees.'

    def hookDir = file('scripts/git-hooks')
    def hookFile = file('scripts/git-hooks/pre-commit')

    doLast {
        if (!hookFile.exists()) {
            throw new GradleException("Missing hook source: ${hookFile}")
        }
        if (!hookFile.setExecutable(true, false)) {
            throw new GradleException("Failed to mark hook executable: ${hookFile}")
        }

        def result = providers.exec {
            commandLine 'git', 'config', 'core.hooksPath', hookDir.path
        }
        result.result.get().assertNormalExitValue()

        def verify = providers.exec {
            commandLine 'git', 'config', '--get', 'core.hooksPath'
        }
        def configured = verify.standardOutput.asText.get().trim()
        logger.lifecycle("git core.hooksPath = ${configured}")
        logger.lifecycle("Pre-commit hook active at ${hookFile}")
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}
